<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ÉLISE</title>
  <meta name="description" content="Un mot et une phrase en français chaque jour.">
  <meta name="theme-color" content="#F7F4EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121A2E" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>

  <nav id="nav" class="nav" aria-label="Navigation principale" hidden>
    <button class="nav-item" data-view="today" type="button">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
      <span>Aujourd'hui</span>
    </button>
    <button class="nav-item" data-view="words" type="button">
      <span class="nav-pill"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg></span>
      <span>Mes mots</span>
    </button>
  </nav>

  <div id="sheet" class="sheet-backdrop" hidden>
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <span class="sheet-grip" aria-hidden="true"></span>
      <div class="sheet-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg></div>
      <h2 id="sheet-title" class="serif">Aucune voix française installée</h2>
      <p class="muted">Pour écouter les mots et les dialogues, installez la voix « Français (France) » : Paramètres › Système › Langues › Synthèse vocale › Speech Services by Google › Installer les données vocales.</p>
      <button class="btn btn-solid" id="sheet-ok" type="button">J'ai compris</button>
    </section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
