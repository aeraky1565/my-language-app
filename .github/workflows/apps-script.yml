name: Push ÉLISE Apps Script

# Pushes apps-script/ to the ÉLISE Apps Script project with clasp, then moves
# the web app deployment to the new version (same /exec URL).
#
# Needs (repo Settings › Secrets and variables › Actions):
#   secret   CLASPRC_JSON         contents of ~/.clasprc.json after `clasp login`
#   variable ELISE_DEPLOYMENT_ID  optional: overrides the web app deployment id below

on:
  push:
    branches: [main]
    paths: ['apps-script/**', '.clasp.json', '.claspignore', '.github/workflows/apps-script.yml']
  workflow_dispatch:

concurrency:
  group: apps-script
  cancel-in-progress: false

env:
  CLASP: npx --yes @google/clasp@3.4.1
  # The ÉLISE web app deployment (its /exec URL). Not a secret: it is part of the URL.
  DEFAULT_DEPLOYMENT_ID: AKfycby6G-fZW5oj01nxuXsC6AkJw28fPToJyEFTdCgqpWkE-9cEscfBPtODgzSbRTjb8wPS

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check project id and credentials
        id: check
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if grep -q 'PASTE_SCRIPT_ID_HERE' .clasp.json; then
            echo "::notice::No script id in .clasp.json yet; nothing to push."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Add the CLASPRC_JSON repository secret (see SETUP.md, step 2)."
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Push code
        if: steps.check.outputs.ready == 'true'
        run: $CLASP push --force

      - name: Update the web app deployment
        if: steps.check.outputs.ready == 'true'
        env:
          DEPLOYMENT_ID: ${{ vars.ELISE_DEPLOYMENT_ID }}
        run: |
          DEPLOYMENT_ID="${DEPLOYMENT_ID:-$DEFAULT_DEPLOYMENT_ID}"
          $CLASP redeploy "$DEPLOYMENT_ID" --description "${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f "$HOME/.clasprc.json"
